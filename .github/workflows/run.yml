name: Run Internship Bot

on:
  # Run every 4 hours on the 0th minute
  schedule:
    - cron: "0 */4 * * *"
  # Also allow manual trigger from the Actions tab
  workflow_dispatch:

# Allow the action to push the updated seen_jobs.db back to the repo
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run the bot
        env:
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          TWILIO_ACCOUNT_SID:   ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:    ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          PREFERENCES_JSON:     ${{ secrets.PREFERENCES_JSON }}
        run: python main.py

      - name: Commit updated seen_jobs.db
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Bot"
          git add seen_jobs.db || true
          git diff --staged --quiet || git commit -m "Update seen_jobs.db [skip ci]"
          git push || true
